name: Discord-Zoom Bridge

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch: {}

concurrency:
  group: discord-zoom-bridge
  cancel-in-progress: false

jobs:
  run-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # 1. Look for existing cache from previous runs
      - name: Restore Zoom session cache
        id: cache-auth
        uses: actions/cache/restore@v4
        with:
          path: auth.json
          key: zoom-auth-session
          restore-keys: |
            zoom-auth-session

      # 2. If no cache found, seed from compressed secret
      - name: Seed auth.json from secret if no cache
        if: steps.cache-auth.outputs.cache-hit != 'true'
        env:
          ZOOM_AUTH_STATE_B64: ${{ secrets.ZOOM_AUTH_STATE_B64 }}
        run: |
          if [ -f auth.json ]; then
            echo "auth.json already present."
          elif [ -n "$ZOOM_AUTH_STATE_B64" ]; then
            echo "$ZOOM_AUTH_STATE_B64" | base64 -d | gzip -d > auth.json
            echo "auth.json successfully seeded from ZOOM_AUTH_STATE_B64."
          else
            echo "::error::No cached auth.json and no ZOOM_AUTH_STATE_B64 secret found."
            exit 1
          fi

      # 3. Run the bridge
      - name: Run bridge
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ZOOM_INVITE_URL: ${{ secrets.ZOOM_INVITE_URL }}
          ZOOM_VERIFICATION_TOKEN: ${{ secrets.ZOOM_VERIFICATION_TOKEN }}
          ZOOM_INCOMING_WEBHOOK_URL_RAW: ${{ secrets.ZOOM_INCOMING_WEBHOOK_URL_RAW }}
          IS_HEADLESS: 'true'
          MAX_RUNTIME_SECONDS: '19800'
        run: node index.js

      # 4. Save refreshed auth.json for the next scheduled workflow
      - name: Save refreshed auth state to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: auth.json
          key: zoom-auth-session-${{ github.run_id }}

      # 5. Export screenshot so we can see what Zoom looks like
      - name: Upload Debug Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zoom-debug-view
          path: zoom-loaded-view.png
